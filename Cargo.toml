[package]
name = "nons-adapter-xiaobai"
version = "1.0.0"
edition = "2021"
license = "MIT"
publish = false

[package.metadata.component]
package = "nons:xiaobai"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nons-music-web-provider = { path = "vendor/music-web-provider" }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.41"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

