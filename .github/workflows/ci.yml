name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Nons workspace
        uses: actions/checkout@v4
        with:
          repository: Miaoyww/Nons
          path: workspace
      - name: Checkout adapter
        uses: actions/checkout@v4
        with:
          path: workspace/adapters/xiaobai
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          targets: wasm32-unknown-unknown
      - name: Install cargo-component
        run: cargo install cargo-component --version 0.21.1 --locked
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workspace/adapters/xiaobai -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build Component and run tests
        working-directory: workspace
        run: |
          node adapters/xiaobai/scripts/build.mjs
          cargo test --manifest-path adapters/xiaobai/Cargo.toml --locked
      - name: Package release asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p workspace/out
          (cd workspace/app/src-tauri/bundled-adapters && zip -qr "../../../out/nsa-xiaobai-${GITHUB_REF_NAME}.zip" xiaobai)
          (cd workspace/out && sha256sum *.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: nsa-xiaobai-release
          path: workspace/out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nsa-xiaobai-release
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes
          fi
